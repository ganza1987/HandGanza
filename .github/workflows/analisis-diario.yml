name: Analisis diario HandGanza

# Partidos de hoy de las ligas de balonmano seguidas (ver scheduler.py), a
# las 9:00 hora de Madrid -- ver run_analisis_diario.py. Sustituye al `while
# True` que habia en scheduler.py (start_scheduler), que mantenia la app de
# Render despierta 24/7 y contribuyo a agotar las 750h/mes gratis
# compartidas entre BaloncestoGanza, FutGanza y HandGanza.
#
# GitHub retrasa a veces los cron programados varias horas, e incluso puede
# no dispararlos ningun dia (visto en BaloncestoGanza el 2026-09-27), asi
# que: minutos "raros" (:17/:47), varios intentos, y run_analisis_diario.py
# acepta cualquier hora entre las 9 y las 18 en Madrid con reserva diaria en
# la base de datos (sin duplicar). Si un dia ningun intento programado
# llega a ejecutarse, lanzar el workflow a mano (Run workflow).
on:
  schedule:
    - cron: '17 7 * * *'
    - cron: '47 7 * * *'
    - cron: '17 8 * * *'
    - cron: '47 8 * * *'
  workflow_dispatch:

concurrency:
  group: analisis-handganza
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Analisis diario de balonmano
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          TELEGRAM_TOKEN_HANDBALL: ${{ secrets.TELEGRAM_TOKEN_HANDBALL }}
          NOTIFY_CHAT_IDS: ${{ secrets.NOTIFY_CHAT_IDS }}
          # En una ejecucion manual se hace siempre, sin esperar a las 9:00.
          FORZAR_ANALISIS: ${{ github.event_name == 'workflow_dispatch' }}
        run: python run_analisis_diario.py
